<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Provette: a plate map goes in, a verified robot protocol and a bench prep sheet come out. The simulator checks the physics; Provette checks the experiment." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f8a5f'/%3E%3Ccircle cx='11' cy='11' r='3.2' fill='white'/%3E%3Ccircle cx='21' cy='11' r='3.2' fill='white' opacity='.55'/%3E%3Ccircle cx='11' cy='21' r='3.2' fill='white' opacity='.55'/%3E%3Ccircle cx='21' cy='21' r='3.2' fill='white'/%3E%3C/svg%3E" />
    <title>Provette</title>
    <script>
      /* the theme before the page draws: dark unless this browser picked another (src/lib/theme.ts) */
      (function () {
        var t = "dark";
        try {
          var q = new URLSearchParams(location.search).get("theme");
          var s = localStorage.getItem("provette.theme");
          t = q === "light" || q === "dark" || q === "auto" ? q : s === "light" || s === "auto" ? s : "dark";
        } catch (e) {}
        if (t !== "auto") document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
