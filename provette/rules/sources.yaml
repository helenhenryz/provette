# The sources a rule may rest on: every row of docs/rule-sources.md, as data.
#
# This file is ours, the biology. No programming is needed to change it.
#
# Each entry is a NAME in capitals and underscores (the name a rule cites in its `sources`
# list), then what it is (`name`) and where to read it (`url`). A rule that cites a name that
# is not here does not load, and `provette check` says which name; so add the source here first.
#
# How to add one: add it to docs/rule-sources.md, with what it says; then add three lines at
# the end of this file, in the same shape as the others:
#     MY_LAB_MANUAL:
#       name: "My lab's manual, page 12: keep the enzyme on ice"
#       url: "https://example.org/manual.pdf"
# The NAME must be new, the url must start with http:// or https://, and both fields are one
# line each. Then run `make check` (or ask the product's rule form to add it: it writes the
# same three lines). The Python rules in this directory cite these names too
# (`sources.THERMO_T4_LIGASE`), so never rename or remove one without changing the rule.

