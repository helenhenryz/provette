[project]
name = "provette"
version = "1.0.0"
description = "A sanitizer for wet-lab robot protocols: the simulator checks the physics, Provette checks the biology."
readme = "README.md"
authors = [{ name = "Helen Henry" }, { name = "Nyle Hussain" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.11"
dependencies = [
    # 9.x refuses every OT-2 protocol, and the broker tap is a legacy internal: DECISIONS.md D-09, D-04.
    "opentrons==8.8.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
provette = "provette.cli:main"

[dependency-groups]
api = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "types-pyyaml>=6.0.12.20260906",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
# The API group is installed by a plain `uv sync`, so `make check` and the image agree.
default-groups = ["dev", "api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# api/ is the product's backend; the image installs the wheel and runs api.worker as a subprocess.
packages = ["provette", "api"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["spikes", "tests/fixtures", "eval/checks/protocols", "eval/baseline/results", "eval/agent/results", ".data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["provette", "api"]

[[tool.mypy.overrides]]
module = ["opentrons.*", "opentrons_shared_data.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "sim: runs the Opentrons simulator in a subprocess (about 2 s each)",
]
